app = "coinbase-for-agents-phone"
primary_region = "sjc"

[build]

[env]
  PORT = "4173"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "data"
  destination = "/app/runtime"
